name: iautomat_auth_manager
description: "A robust Flutter package for authentication management with multiple providers (Firebase Auth & Supabase Auth) using email and password. Features Result pattern, comprehensive error handling, and 87%+ test coverage."
version: 1.1.1
homepage: https://github.com/yourusername/iautomat_auth_manager
repository: https://github.com/yourusername/iautomat_auth_manager
issue_tracker: https://github.com/yourusername/iautomat_auth_manager/issues
documentation: https://github.com/yourusername/iautomat_auth_manager#readme

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.0.2
  supabase: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  mocktail: ^1.0.0
